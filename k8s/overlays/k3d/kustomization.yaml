apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devices

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: devices-configuration
    behavior: merge
    literals:
      - kafka-bootstrap-servers=devices-kafka:9092
      - spring-profile-active=dev
      - JWT_ISSUER_URI=http://devices-keycloak:8080/realms/iot

secretGenerator:
  - name: devices-configuration-db
    literals:
      - jdbc-url=jdbc:postgresql://devices-db-postgresql:5432/devices
      - username=devices
      - password=devices
