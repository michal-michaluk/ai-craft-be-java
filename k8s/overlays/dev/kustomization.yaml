apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devices-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: devices-configuration
    behavior: merge
    literals:
      - kafka-bootstrap-servers=localhost:9092
      - spring-profile-active=dev

secretGenerator:
  - name: devices-configuration-db
    literals:
      - jdbc-url=jdbc:postgresql://localhost:5432/devices_dev
      - username=dev_user
      - password=dev_password
