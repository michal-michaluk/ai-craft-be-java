apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devices

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

labels:
  - pairs:
      app: devices-configuration
      managed-by: kustomize

images:
  - name: devices-configuration
    newName: devices-configuration
    newTag: latest

configMapGenerator:
  - name: devices-configuration
    behavior: merge
    literals:
      - kafka-bootstrap-servers=kafka:9092
