apiVersion: apps/v1
kind: Deployment
metadata:
  name: devices-configuration
  labels:
    app: devices-configuration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devices-configuration
  template:
    metadata:
      labels:
        app: devices-configuration
    spec:
      containers:
        - name: devices-configuration
          image: devices-configuration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: devices-configuration-db
                  key: jdbc-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devices-configuration-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devices-configuration-db
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: devices-configuration
                  key: kafka-bootstrap-servers
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: devices-configuration
                  key: JWT_ISSUER_URI
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
